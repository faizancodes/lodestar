[project]
name = "auto-interp"
version = "0.1.0"
description = "Local Mac app for mechanistic interpretability on local LLMs: activations, neuron steering, automatic tuning search."
requires-python = ">=3.11"
dependencies = [
    "torch>=2.5",
    "transformers>=4.51",
    "accelerate",
    "safetensors",
    "numpy",
    "fastapi",
    "uvicorn",
    "pywebview>=5.3",
]

[tool.uv]
package = false
