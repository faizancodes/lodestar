[project]
name = "auto-interp"
version = "0.2.2"
description = "Local Mac app for mechanistic interpretability on local LLMs: activations, neuron steering, automatic tuning search."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "torch>=2.5",
    "transformers>=5.24",
    "accelerate",
    "safetensors",
    "numpy",
    "fastapi",
    "uvicorn",
    "pywebview>=5.3",
    "psutil",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.8",
    "httpx>=0.27",
]
icons = [
    "pillow>=10.0",
]

[tool.uv]
package = false

[tool.ruff]
target-version = "py311"
line-length = 119

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "B",    # flake8-bugbear
    "UP",   # pyupgrade
    "SIM",  # flake8-simplify
    "RUF",  # ruff-specific rules
]
ignore = [
    "E501",   # line length handled conservatively where long prose/regexes occur
    "RUF001", # intentional Unicode typography (en-dash, curly quotes, multiplication sign)
    "RUF002", # intentional Unicode math/typography in docstrings
    "RUF003", # intentional Unicode math/typography in comments
    "SIM108", # allow readable if/else blocks over forced ternaries
]

[tool.ruff.lint.isort]
lines-after-imports = 2
known-first-party = ["interp", "scripts"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-q"
